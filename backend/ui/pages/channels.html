<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevReady - Poolside</title>
    <link class="domainLogo" rel="icon" href="../assets/devLogo.svg" sizes="any" type="image/svg+xml" />
    <link id="domainCss" rel="stylesheet" href="../assets/devStyles.css" />
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const requested = params.get("domain") || sessionStorage.getItem("domain") || "dev";
        const domain = requested === "technology" ? "dev" : (["dev", "engineer", "law"].includes(requested) ? requested : "dev");
        sessionStorage.setItem("domain", domain);
        const css = document.getElementById("domainCss");
        if (css) css.href = `../assets/${domain}Styles.css`;
        document.documentElement.dataset.domain = domain;
      })();
    </script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="JS/pageAgents.js?v=20260620-channels"></script>
    <script>
      $(function () {
        $("#siteSidebar").load("components/sidebar.html?v=20260620-channels");
        $("#searchBar").load("components/searchBar.html");
      });
    </script>
    <style>
      .channels-page {
        display: grid;
        gap: 12px;
      }

      .channels-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .channels-top h1 {
        margin: 0;
      }

      .teams-shell {
        display: grid;
        grid-template-columns: 310px minmax(0, 1fr) 310px;
        gap: 12px;
        min-height: calc(100vh - 170px);
      }

      .teams-panel {
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.06);
        overflow: hidden;
      }

      .teams-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 54px;
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
        background: #fbfcfb;
      }

      .teams-panel-head h2,
      .thread-title h2 {
        margin: 0;
        font-size: 16px;
        line-height: 1.15;
      }

      .teams-panel-head .muted,
      .thread-title .muted {
        margin: 3px 0 0;
      }

      .conversation-list,
      .people-list {
        display: grid;
        gap: 6px;
        max-height: calc(100vh - 260px);
        overflow-y: auto;
        padding: 10px;
      }

      .conversation-item {
        width: 100%;
        min-height: 64px;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 9px 10px;
        background: #fff;
        color: var(--text);
        cursor: pointer;
        text-align: left;
      }

      .conversation-item:hover,
      .conversation-item.active {
        border-color: rgba(var(--primary-rgb), 0.35);
        background: rgba(var(--primary-rgb), 0.08);
      }

      .conversation-item strong,
      .person-row strong,
      .participant-chip strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .conversation-item span,
      .person-row span,
      .participant-chip span {
        display: block;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .thread-panel {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        min-height: calc(100vh - 170px);
      }

      .thread-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding: 12px;
        background: #fff;
      }

      .thread-actions,
      .compose-actions,
      .new-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .message-log {
        display: grid;
        align-content: start;
        gap: 10px;
        min-height: 0;
        overflow-y: auto;
        padding: 14px;
        background: #f6f8f7;
      }

      .message-row {
        display: grid;
        gap: 6px;
        max-width: 760px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        background: #fff;
      }

      .message-row.mine {
        justify-self: end;
        border-color: rgba(var(--primary-rgb), 0.35);
        background: rgba(var(--primary-rgb), 0.08);
      }

      .message-row.egeria {
        border-color: rgba(135, 163, 130, 0.55);
        background: linear-gradient(135deg, #f8fbf5, #eef4ee);
      }

      .message-meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .message-author {
        color: var(--text);
        font-weight: 950;
      }

      .message-author.egeria {
        color: #37643d;
      }

      .message-text {
        white-space: pre-wrap;
        line-height: 1.42;
      }

      .composer {
        display: grid;
        gap: 8px;
        border-top: 1px solid var(--line);
        padding: 12px;
        background: #fff;
      }

      .composer textarea,
      .message-dialog-card input,
      .message-dialog-card textarea,
      .email-input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 10px;
        background: #fff;
        font: inherit;
      }

      .composer textarea {
        min-height: 82px;
        resize: vertical;
      }

      .person-row {
        display: grid;
        gap: 2px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 9px;
        background: #fff;
      }

      .participant-list {
        display: grid;
        gap: 7px;
        max-height: 220px;
        overflow-y: auto;
        padding: 10px;
      }

      .participant-chip {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 2px;
        align-items: center;
        border: 1px solid rgba(var(--primary-rgb), 0.22);
        border-radius: 10px;
        padding: 8px 9px;
        background: rgba(var(--primary-rgb), 0.06);
      }

      .participant-chip.egeria {
        border-color: rgba(135, 163, 130, 0.65);
        background: linear-gradient(135deg, #f7faf4, #edf3ed);
      }

      .participant-chip.egeria strong::before {
        content: "AI ";
        color: #6d786f;
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      .participant-copy {
        min-width: 0;
      }

      .remove-person {
        min-height: 30px;
        border: 0;
        padding: 4px 6px;
        background: transparent;
        color: #8c2f39;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 900;
      }

      .remove-person:hover {
        text-decoration: underline;
      }

      .add-people-box {
        display: grid;
        gap: 8px;
        border-top: 1px solid var(--line);
        padding: 10px;
        background: #fbfcfb;
      }

      .status-line {
        min-height: 18px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .message-dialog {
        position: fixed;
        z-index: 10000;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(22, 27, 24, 0.48);
      }

      .message-dialog[hidden] {
        display: none;
      }

      .message-dialog-card {
        display: grid;
        gap: 14px;
        width: min(620px, 100%);
        min-width: 0;
        max-height: calc(100vh - 40px);
        box-sizing: border-box;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.24);
      }

      .message-dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .message-dialog-head h2 {
        margin: 0;
        font-size: 20px;
      }

      .message-field {
        display: grid;
        gap: 6px;
        color: var(--text);
        font-size: 13px;
        font-weight: 900;
      }

      .message-dialog-card textarea {
        min-height: 150px;
        resize: vertical;
      }

      @media (max-width: 1180px) {
        .teams-shell {
          grid-template-columns: 280px minmax(0, 1fr);
        }

        .people-panel {
          grid-column: 1 / -1;
          min-height: auto;
        }
      }

      @media (max-width: 860px) {
        .container {
          grid-template-columns: minmax(0, 1fr);
          width: 100%;
          max-width: 100%;
          overflow-x: hidden;
        }

        #siteSidebar {
          display: none;
        }

        .main.channels-page {
          width: 100%;
          min-width: 0;
          box-sizing: border-box;
          padding: 14px;
        }

        .teams-shell {
          grid-template-columns: 1fr;
        }

        .thread-panel {
          min-height: 620px;
        }

        .message-dialog {
          place-items: end stretch;
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="siteSidebar"></div>
      <main class="main channels-page">
        <div id="searchBar"></div>
        <section class="channels-top">
          <div>
            <h1>Poolside</h1>
            <p class="muted">Focused conversations with clients, partners, and team members.</p>
          </div>
          <div class="thread-actions">
            <button class="btn primary" type="button" onclick="openNewConversation()">New message</button>
            <button class="btn secondary" type="button" onclick="copyConversationLink()">Copy link</button>
          </div>
        </section>

        <section class="teams-shell">
          <aside class="teams-panel">
            <div class="teams-panel-head">
              <div>
                <h2>Conversations</h2>
                <p id="conversationCount" class="muted">Loading...</p>
              </div>
            </div>
            <div id="conversationList" class="conversation-list">Loading conversations...</div>
          </aside>

          <section class="teams-panel thread-panel">
            <header class="thread-head">
              <div class="thread-title">
                <h2 id="conversationTitle">Conversation</h2>
                <p id="conversationTopic" class="muted"></p>
              </div>
              <div class="thread-actions">
                <button class="btn secondary" type="button" onclick="focusInvite()">Add person</button>
                <button class="btn secondary" type="button" onclick="loadMessages()">Refresh</button>
              </div>
            </header>
            <div id="messageLog" class="message-log">Loading messages...</div>
            <form class="composer" onsubmit="sendMessage(event)">
              <textarea id="messageInput" placeholder="Type a new message..."></textarea>
              <div class="compose-actions">
                <button class="btn primary" type="submit">Send</button>
                <span id="sendStatus" class="status-line"></span>
              </div>
            </form>
          </section>

          <aside class="teams-panel people-panel">
            <div class="teams-panel-head">
              <div>
                <h2>Participants</h2>
                <p id="peopleSummary" class="muted">Loading...</p>
              </div>
            </div>
            <div id="participantList" class="participant-list"></div>
            <form class="add-people-box" onsubmit="addPersonToConversation(event)">
              <input id="addPersonEmail" class="email-input" type="email" placeholder="Email address" autocomplete="email" required />
              <button class="btn secondary" type="submit">Add to conversation</button>
              <span id="peopleStatus" class="status-line"></span>
            </form>
          </aside>
        </section>

        <div id="newConversationDialog" class="message-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="newConversationHeading">
          <form class="message-dialog-card" onsubmit="createConversation(event)">
            <header class="message-dialog-head">
              <h2 id="newConversationHeading">New message</h2>
              <button class="btn secondary" type="button" onclick="closeNewConversation()">Close</button>
            </header>
            <label class="message-field">
              To
              <input id="newRecipientEmail" type="email" placeholder="Email address" autocomplete="email" required />
            </label>
            <label class="message-field">
              Subject
              <input id="newConversationTitle" placeholder="Subject" autocomplete="off" />
            </label>
            <label class="message-field">
              Message
              <textarea id="newConversationMessage" placeholder="Write a message..." required></textarea>
            </label>
            <div class="new-actions">
              <button class="btn primary" type="submit">Send message</button>
              <button class="btn secondary" type="button" onclick="closeNewConversation()">Cancel</button>
              <span id="newConversationStatus" class="status-line"></span>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script>
      let conversations = [];
      let activeConversationId = new URLSearchParams(window.location.search).get("conversation") || new URLSearchParams(window.location.search).get("channel") || "general";

      function currentDomain() {
        return sessionStorage.getItem("domain") || document.documentElement.dataset.domain || "dev";
      }

      function currentUser() {
        try {
          return JSON.parse(sessionStorage.getItem("devreadyUser") || localStorage.getItem("devreadyUser") || "null") || {};
        } catch {
          return {};
        }
      }

      function apiUrl(path, params = {}) {
        const url = new URL(path, window.location.origin);
        Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value));
        return url.toString();
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function isEgeria(person) {
        const email = String(person?.email || person?.author_email || "").toLowerCase();
        const name = String(person?.name || person?.author_name || "").toLowerCase();
        return email === "egeria@devready.ai" || name === "egeria";
      }

      function activeConversation() {
        return conversations.find((conversation) => conversation.id === activeConversationId) || conversations[0] || null;
      }

      function conversationUrl() {
        const url = new URL(window.location.href);
        url.searchParams.set("domain", currentDomain());
        url.searchParams.set("conversation", activeConversationId || "general");
        url.searchParams.delete("channel");
        return url.toString();
      }

      function sharedConversationUrl() {
        const url = new URL("channel.html", window.location.href);
        url.searchParams.set("domain", currentDomain());
        url.searchParams.set("conversation", activeConversationId || "general");
        return url.toString();
      }

      async function loadConversations() {
        const response = await fetch(apiUrl("/api/channels/conversations", { domain: currentDomain() }), { cache: "no-store" });
        const data = await response.json();
        conversations = data.conversations || [];
        if (!conversations.some((conversation) => conversation.id === activeConversationId)) {
          activeConversationId = conversations[0]?.id || "general";
        }
        renderConversations();
        renderThread();
        await loadMessages();
      }

      function renderConversations() {
        document.getElementById("conversationCount").textContent = `${conversations.length} threads`;
        document.getElementById("conversationList").innerHTML = conversations
          .map((conversation) => `
            <button class="conversation-item${conversation.id === activeConversationId ? " active" : ""}" type="button" onclick="setConversation('${escapeHtml(conversation.id)}')">
              <strong>${escapeHtml(conversation.title || conversation.id)}</strong>
              <span>${escapeHtml(conversation.last_message || conversation.topic || "No messages yet")}</span>
            </button>
          `)
          .join("") || `<div class="message-row"><strong>No conversations.</strong><span class="muted">Create one to get started.</span></div>`;
      }

      function renderThread() {
        const conversation = activeConversation();
        document.getElementById("conversationTitle").textContent = conversation?.title || "Conversation";
        document.getElementById("conversationTopic").textContent = conversation?.topic || conversationUrl();
        renderParticipants();
        const url = new URL(window.location.href);
        url.searchParams.set("domain", currentDomain());
        url.searchParams.set("conversation", activeConversationId || "general");
        url.searchParams.delete("channel");
        history.replaceState({}, "", url.toString());
      }

      async function setConversation(conversationId) {
        activeConversationId = conversationId || "general";
        renderConversations();
        renderThread();
        await loadMessages();
      }

      async function loadMessages() {
        const log = document.getElementById("messageLog");
        const conversation = activeConversation();
        if (!conversation) {
          log.textContent = "Create a conversation to begin.";
          return;
        }
        log.textContent = "Loading messages...";
        try {
          const response = await fetch(apiUrl("/api/channels/messages", {
            domain: currentDomain(),
            conversation_id: conversation.id,
          }), { cache: "no-store" });
          const data = await response.json();
          const me = (currentUser().email || "").toLowerCase();
          const messages = data.messages || [];
          if (!messages.length) {
            log.innerHTML = `<div class="message-row"><strong>No messages yet.</strong><span class="muted">Start this conversation with a short update.</span></div>`;
            return;
          }
          log.innerHTML = messages
            .map((message) => {
              const mine = me && String(message.author_email || "").toLowerCase() === me;
              const egeria = isEgeria(message);
              return `
                <article class="message-row${mine ? " mine" : ""}${egeria ? " egeria" : ""}">
                  <div class="message-meta">
                    <span class="message-author${egeria ? " egeria" : ""}">${escapeHtml(message.author_name || "DevReady User")}</span>
                    <span>${escapeHtml(new Date(message.created_at || Date.now()).toLocaleString())}</span>
                  </div>
                  <div class="message-text">${escapeHtml(message.message || "")}</div>
                </article>
              `;
            })
            .join("");
          log.scrollTop = log.scrollHeight;
        } catch {
          log.textContent = "Messages are unavailable. Confirm the backend is running and refresh.";
        }
      }

      async function sendMessage(event) {
        event.preventDefault();
        const input = document.getElementById("messageInput");
        const status = document.getElementById("sendStatus");
        const text = input.value.trim();
        const conversation = activeConversation();
        if (!text || !conversation) return;
        const user = currentUser();
        const body = new URLSearchParams({
          domain: currentDomain(),
          channel: conversation.id,
          conversation_id: conversation.id,
          message: text,
          audience: "conversation",
          author_name: user.display_name || user.username || user.email || "",
          author_email: user.email || "",
        });
        status.textContent = "Sending...";
        try {
          const response = await fetch("/api/channels/messages", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: body.toString(),
          });
          const data = await response.json();
          if (!response.ok || data.ok === false) throw new Error(data.detail || "Message failed.");
          input.value = "";
          status.textContent = "Sent.";
          await loadConversations();
        } catch (error) {
          status.textContent = error.message || "Message failed.";
        }
      }

      function normalizeEmail(value) {
        return String(value || "").trim().toLowerCase();
      }

      function emailDisplayName(email) {
        const local = normalizeEmail(email).split("@")[0] || "Participant";
        return local
          .replace(/[._+-]+/g, " ")
          .replace(/\b\w/g, (letter) => letter.toUpperCase());
      }

      function participantFromEmail(email) {
        const normalized = normalizeEmail(email);
        return { email: normalized, name: emailDisplayName(normalized) };
      }

      function focusInvite() {
        document.querySelector(".people-panel")?.scrollIntoView({ behavior: "smooth", block: "start" });
        const input = document.getElementById("addPersonEmail");
        input?.focus();
        document.getElementById("peopleStatus").textContent = "";
      }

      function openNewConversation() {
        const dialog = document.getElementById("newConversationDialog");
        dialog.hidden = false;
        document.getElementById("newConversationStatus").textContent = "";
        document.getElementById("newRecipientEmail").focus();
      }

      function closeNewConversation() {
        document.getElementById("newConversationDialog").hidden = true;
      }

      async function createConversation(event) {
        event.preventDefault();
        const recipientEmail = normalizeEmail(document.getElementById("newRecipientEmail").value);
        const rawTitle = document.getElementById("newConversationTitle").value.trim();
        const firstMessage = document.getElementById("newConversationMessage").value.trim();
        const status = document.getElementById("newConversationStatus");
        const user = currentUser();
        if (!recipientEmail) {
          status.textContent = "Enter a recipient email address.";
          return;
        }
        if (!firstMessage) {
          status.textContent = "Write the first message.";
          return;
        }
        const participants = [participantFromEmail(recipientEmail)];
        const title = rawTitle || `Message with ${recipientEmail}`;
        const topic = `Conversation with ${recipientEmail}`;
        status.textContent = "Sending...";
        const body = new URLSearchParams({
          domain: currentDomain(),
          title,
          topic,
          participants_json: JSON.stringify(participants),
          created_by_name: user.display_name || user.username || user.email || "",
          created_by_email: user.email || "",
        });
        try {
          const response = await fetch("/api/channels/conversations", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: body.toString(),
          });
          const data = await response.json();
          if (!response.ok || data.ok === false) throw new Error(data.detail || "Conversation failed.");
          activeConversationId = data.conversation.id;
          const messageBody = new URLSearchParams({
            domain: currentDomain(),
            channel: activeConversationId,
            conversation_id: activeConversationId,
            message: firstMessage,
            audience: "conversation",
            author_name: user.display_name || user.username || user.email || "",
            author_email: user.email || "",
          });
          const messageResponse = await fetch("/api/channels/messages", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: messageBody.toString(),
          });
          const messageData = await messageResponse.json();
          if (!messageResponse.ok || messageData.ok === false) throw new Error(messageData.detail || "Message failed.");
          document.getElementById("newRecipientEmail").value = "";
          document.getElementById("newConversationTitle").value = "";
          document.getElementById("newConversationMessage").value = "";
          closeNewConversation();
          await loadConversations();
        } catch (error) {
          status.textContent = error.message || "Message failed.";
        }
      }

      function renderParticipants() {
        const participants = activeConversation()?.participants || [];
        const humanCount = participants.filter((person) => !isEgeria(person)).length;
        document.getElementById("peopleSummary").textContent = `${humanCount} ${humanCount === 1 ? "person" : "people"}`;
        document.getElementById("participantList").innerHTML = participants
          .map((person) => {
            const egeria = isEgeria(person);
            return `
              <div class="participant-chip${egeria ? " egeria" : ""}">
                <div class="participant-copy">
                  <strong>${escapeHtml(person.name || person.email || "Participant")}</strong>
                  <span>${escapeHtml(egeria ? "Conversation helper" : (person.email || ""))}</span>
                </div>
                ${egeria ? "" : `<button class="remove-person" type="button" onclick="removePersonFromConversation('${encodeURIComponent(person.email || "")}')">Remove</button>`}
              </div>
            `;
          })
          .join("") || `<div class="participant-chip"><div class="participant-copy"><strong>No participants yet.</strong></div></div>`;
      }

      async function addPersonToConversation(event) {
        event.preventDefault();
        const conversation = activeConversation();
        const status = document.getElementById("peopleStatus");
        if (!conversation) return;
        const input = document.getElementById("addPersonEmail");
        const email = normalizeEmail(input.value);
        if (!email) {
          status.textContent = "Enter an email address.";
          return;
        }
        status.textContent = "Adding...";
        const body = new URLSearchParams({
          domain: currentDomain(),
          participants_json: JSON.stringify([participantFromEmail(email)]),
        });
        try {
          const response = await fetch(`/api/channels/conversations/${encodeURIComponent(conversation.id)}/participants`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: body.toString(),
          });
          const data = await response.json();
          if (!response.ok || data.ok === false) throw new Error(data.detail || "Could not add that email.");
          const index = conversations.findIndex((item) => item.id === data.conversation.id);
          if (index >= 0) conversations[index] = data.conversation;
          input.value = "";
          status.textContent = `${email} added.`;
          renderThread();
        } catch (error) {
          status.textContent = error.message || "Could not add that email.";
        }
      }

      async function removePersonFromConversation(encodedEmail) {
        const conversation = activeConversation();
        const status = document.getElementById("peopleStatus");
        const email = decodeURIComponent(encodedEmail || "");
        if (!conversation || !email) return;
        if (!confirm(`Remove ${email} from this conversation?`)) return;
        status.textContent = "Removing...";
        const body = new URLSearchParams({ domain: currentDomain(), email });
        try {
          const response = await fetch(`/api/channels/conversations/${encodeURIComponent(conversation.id)}/participants`, {
            method: "DELETE",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: body.toString(),
          });
          const data = await response.json();
          if (!response.ok || data.ok === false) throw new Error(data.detail || "Could not remove that person.");
          const index = conversations.findIndex((item) => item.id === data.conversation.id);
          if (index >= 0) conversations[index] = data.conversation;
          status.textContent = `${email} removed.`;
          renderThread();
        } catch (error) {
          status.textContent = error.message || "Could not remove that person.";
        }
      }

      async function copyText(text, label) {
        const status = document.getElementById("peopleStatus");
        try {
          await navigator.clipboard.writeText(text);
          status.textContent = `${label} copied.`;
        } catch {
          status.textContent = `Copy unavailable: ${text}`;
        }
      }

      function copyConversationLink() {
        copyText(sharedConversationUrl(), "Standalone Poolside app link");
      }

      document.addEventListener("DOMContentLoaded", async () => {
        try {
          await loadConversations();
          setInterval(loadMessages, 30000);
        } catch {
          document.getElementById("conversationList").textContent = "Poolside is unavailable. Refresh after the backend is available.";
        }
      });
    </script>
  </body>
</html>
