<style>

<div class="topbar-tools">
  <div class="header-userbox" aria-label="Current workspace user">
    <div class="welcome-copy">
      <span class="eyebrow">Welcome back</span>
      <span id="headerUserName" class="name">DevReady User</span>
    </div>
    <div id="headerEnvironmentNotice" class="workspace-status-link">Loading status...</div>
  </div>
  <div class="search-container">
    <div class="search">
      <input
        id="searchInput"
        class="input"
        style="position: relative; left: 0"
        placeholder="Search for profiles (name / email)"
        autocomplete="off"
      />
      <button id="searchButton" class="btn" type="button">Search</button>
    </div>
    <table
      id="searchResultsTable"
      class="card table"
      style="position: absolute; border: none"
      hidden
    >
      <tbody id="searchResults">
        <!-- Dynamically filled with ranked results -->
      </tbody>
    </table>
  </div>
</div>

<script>
  function currentDevReadySearchUser() {
    try {
      return JSON.parse(sessionStorage.getItem("devreadyUser") || localStorage.getItem("devreadyUser") || "null");
    } catch {
      return null;
    }
  }

  function renderHeaderUserContext() {
    const user = currentDevReadySearchUser();
    const name = document.getElementById("headerUserName");
    if (name && user) {
      name.textContent = user.display_name || user.username || user.email || "DevReady User";
    }
    if (typeof window.environmentUpdate === "function") {
      window.environmentUpdate();
    } else {
      setTimeout(() => {
        if (typeof window.environmentUpdate === "function") window.environmentUpdate();
      }, 150);
    }
  }

  function applyHeaderShortcutAccess() {
    const user = currentDevReadySearchUser();
    if (!user || user.role === "super_user") return;
    const isAdministrator = String(user.username || "").trim().toLowerCase() === "administrator";
    const allowed = new Set(user.allowed_menu || []);
    if (isAdministrator) {
      allowed.add("admin");
      allowed.add("agents");
    }
    if (allowed.has("interviews")) allowed.add("status");
    if (allowed.has("status") || allowed.has("profiles") || allowed.has("time_link")) allowed.add("reports");
    if (allowed.has("time_link") || allowed.has("status")) allowed.add("onboarding");
    document.querySelectorAll(".header-shortcuts [data-menu-key]").forEach((item) => {
      const key = item.dataset.menuKey;
      if (!allowed.has(key)) item.remove();
    });
    if (!document.querySelector(".header-shortcuts [data-menu-key]")) {
      document.querySelector(".header-shortcuts")?.remove();
    }
  }

  function applyHeaderShortcutDomains() {
    const domain = currentRadarDomain();
    document.querySelectorAll(".header-shortcuts a[href]").forEach((link) => {
      const url = new URL(link.getAttribute("href"), window.location.href);
      if (url.origin === window.location.origin) {
        url.searchParams.set("domain", domain);
        link.href = `${url.pathname.split("/").pop()}?${url.searchParams.toString()}`;
      }
    });
    const path = window.location.pathname.toLowerCase();
    document.querySelectorAll(".header-shortcuts a").forEach((link) => {
      const linkPath = new URL(link.href).pathname.toLowerCase();
      link.classList.toggle("active", path === linkPath && (!link.dataset.radarLaunch || new URLSearchParams(window.location.search).get("radar") === "1"));
    });
  }

  function currentRadarDomain() {
    const params = new URLSearchParams(window.location.search);
    const requested = params.get("domain") || sessionStorage.getItem("domain") || "dev";
    if (requested === "technology" || requested === "tech") return "dev";
    return ["dev", "engineer", "law"].includes(requested) ? requested : "dev";
  }

  function escapeRadarHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function radarDomainLabel(domain) {
    return domain === "engineer" ? "Engineering" : domain === "law" ? "Law" : "Technology";
  }

  function isTalentWorkflowRadarPage() {
    const path = window.location.pathname.toLowerCase();
    return [
      "find-candidate.html",
      "match-role.html",
      "mine-candidate-external.html",
      "job-descriptions.html",
      "profile-preview.html",
      "profile-preview-edit.html",
      "profile-public.html",
      "profile-search-results.html",
    ].some((page) => path.endsWith(page));
  }

  function updateRadarVisibility() {
    const tools = document.querySelector(".topbar-tools");
    if (!tools) return;
    const params = new URLSearchParams(window.location.search);
    const visible = params.get("radar") === "1";
    tools.classList.toggle("radar-visible", visible);
  }

  window.openOpportunityRadar = function openOpportunityRadar() {
    window.location.href = `egeria.html?domain=${encodeURIComponent(currentRadarDomain())}`;
  };

  function radarSourcePill(source) {
    const ready = source && source.ready;
    return `<span class="ai-source-pill">${ready ? "Ready" : "Needs key"}: ${escapeRadarHtml(source?.label || "Source")}</span>`;
  }

  function scorePartsHtml(parts) {
    if (!parts || typeof parts !== "object") return "";
    const labels = [
      ["exact_required", "Exact"],
      ["related", "Related"],
      ["skill_depth", "Depth"],
      ["search_rank", "Rank"],
      ["crm_signal", "CRM"],
      ["role_title", "Role"],
      ["process", "Ready"],
    ];
    const chips = labels
      .filter(([key]) => parts[key] !== undefined && parts[key] !== null)
      .map(([key, label]) => `<span>${label}: ${escapeRadarHtml(parts[key])}</span>`)
      .join("");
    return chips ? `<div class="ai-score-detail">${chips}</div>` : "";
  }

  function radarSourceLabel(item) {
    if (item.source === "people_data_labs") return "External prospect";
    if (item.source === "azure_candidate_database") return "Internal profile";
    return "Internal profile";
  }

  function renderOpportunityRadar(data) {
    const panel = document.getElementById("aiRadarPanel");
    const status = document.getElementById("aiRadarStatus");
    const close = document.getElementById("aiRadarClose");
    if (!panel) return;
    document.querySelector(".topbar-tools")?.classList.add("radar-expanded");
    const counts = data.counts || {};
    const narrative = data.narrative || {};
    const suggestions = Array.isArray(data.suggestions) ? data.suggestions : [];
    status.textContent = narrative.headline || `Egeria: Opportunity scanned ${radarDomainLabel(data.domain)}.`;
    close.hidden = false;
    panel.classList.add("active");
    const externalRequested = Boolean(data.external?.requested);
    const cards = suggestions.length
      ? suggestions.map((item, index) => {
          const candidate = item.candidate || {};
          const job = item.job || {};
          const client = item.client || {};
          const links = item.links || {};
          const isExternal = item.source === "people_data_labs";
          const isRecommended = index === 0 && !isExternal;
          return `
            <article class="ai-radar-card ${isRecommended ? "recommended" : ""} ${isExternal ? "external" : ""}">
              <div class="ai-radar-kicker">
                ${isRecommended ? '<span class="ai-recommend-pill">Recommended candidate</span>' : ""}
                <span class="ai-source-pill">${escapeRadarHtml(radarSourceLabel(item))}</span>
              </div>
              <div class="ai-radar-card-top">
                <div>
                  <strong>${escapeRadarHtml(candidate.name || "Candidate")} &rarr; ${escapeRadarHtml(job.title || "Role")}</strong>
                  <span>${escapeRadarHtml(job.company || client.name || "No client linked")} ${client.stage ? "&bull; " + escapeRadarHtml(client.stage) : ""}</span>
                </div>
                <span class="ai-score-pill">${escapeRadarHtml(item.score)}%</span>
              </div>
              <span>${escapeRadarHtml(item.reason)}</span>
              ${scorePartsHtml(item.score_parts)}
              <span><b>Next:</b> ${escapeRadarHtml(item.next_action)}</span>
              <div class="ai-radar-card-actions">
                <a class="btn secondary" href="${escapeRadarHtml(links.profile || "#")}">Open profile</a>
                <a class="btn secondary" href="${escapeRadarHtml(links.match || "#")}">Open match</a>
                <a class="btn secondary" href="${escapeRadarHtml(links.client_comm || "#")}">Client comms</a>
              </div>
            </article>
          `;
        }).join("")
      : '<div class="notice">No strong radar suggestions yet. Load or normalize a job description, then run the radar again.</div>';
    const externalPrompt = externalRequested
      ? '<div class="notice">Outside data is included below internal matches. Treat external people as temporary prospects until reviewed and promoted.</div>'
      : `
        <div class="ai-radar-next-scan">
          <div>
            <strong>Want Egeria to look outside the internal database?</strong>
            <span>Start with internal profiles first. If those are thin, scan People Data and future GitHub/code signals as temporary external prospects.</span>
          </div>
          <button id="aiRadarScanExternal" class="btn" type="button">Scan outside data</button>
        </div>
      `;
    panel.innerHTML = `
      <div class="ai-radar-summary">
        <div class="ai-radar-brief">
          <strong>${escapeRadarHtml(narrative.headline || "Egeria: Opportunity")}</strong>
          <span>${escapeRadarHtml(narrative.brief || "")}</span>
          <span>${escapeRadarHtml(narrative.sales_angle || "")}</span>
          <span>Score basis: exact required skills, related evidence, skill depth, profile readiness, role-title alignment, and CRM signal. Internal profiles always show before outside prospects.</span>
        </div>
        <div class="ai-radar-stat"><b>${counts.jobs_scanned || 0}</b><span>Jobs</span></div>
        <div class="ai-radar-stat"><b>${counts.profiles_scanned || 0}</b><span>Profiles</span></div>
        <div class="ai-radar-stat"><b>${counts.crm_records_scanned || 0}</b><span>CRM signals</span></div>
        <div class="ai-radar-stat"><b>${counts.suggestions || 0}</b><span>Ideas</span></div>
      </div>
      ${externalPrompt}
      <div class="ai-radar-grid">${cards}</div>
      <div class="ai-radar-external">
        ${radarSourcePill(data.external?.people_data)}
        ${radarSourcePill(data.external?.github)}
        ${radarSourcePill(data.external?.news)}
        <span>External scans are gated by configured API keys and stay separate from permanent profiles until reviewed.</span>
      </div>
    `;
  }

  async function runOpportunityRadar(includeExternal) {
    const status = document.getElementById("aiRadarStatus");
    const panel = document.getElementById("aiRadarPanel");
    if (status) status.textContent = includeExternal ? "Egeria is scanning internal matches first, then outside prospects..." : "Egeria is scanning internal jobs, profiles, and CRM signals first...";
    document.querySelector(".topbar-tools")?.classList.add("radar-expanded");
    if (panel) {
      panel.classList.add("active");
      panel.innerHTML = '<div class="notice">AI Radar scan running. Looking for hidden matches, sales angles, and next actions...</div>';
    }
    try {
      const domain = currentRadarDomain();
      const response = await fetch(`/api/ai/opportunity-radar?domain=${encodeURIComponent(domain)}&limit=5&include_external=${includeExternal ? "true" : "false"}`);
      const data = await response.json();
      if (!response.ok || data.ok === false) throw new Error(data.detail || "Egeria: Opportunity could not complete.");
      renderOpportunityRadar(data);
    } catch (error) {
      if (status) status.textContent = error.message || "Egeria: Opportunity could not complete.";
      if (panel) panel.innerHTML = `<div class="notice">${escapeRadarHtml(error.message || "Egeria: Opportunity could not complete.")}</div>`;
    }
  }

  function ensureProfileCompletionHelper() {
    if (window.profileCompletion) return Promise.resolve();
    if (window.profileCompletionHelperLoading) return window.profileCompletionHelperLoading;
    window.profileCompletionHelperLoading = new Promise((resolve) => {
      const script = document.createElement("script");
      script.src = "JS/profileCompletion.js";
      script.onload = resolve;
      script.onerror = resolve;
      document.head.appendChild(script);
    });
    return window.profileCompletionHelperLoading;
  }

  function searchButton() {
    let domain = sessionStorage.getItem("domain");
    window.location.href = `profile-search-results.html?domain=${domain ? domain : "dev"}&query=${encodeURIComponent(document.getElementById("searchInput").value)}&page=1&pageLimit=10`;
  }

  function searchSelect(profile) {
    sessionStorage.setItem("candidateId", profile.id);
    sessionStorage.setItem(
      "candidateName",
      profile.firstName + " " + profile.lastName,
    );
    sessionStorage.setItem("candidateStatus", profile.step);
    sessionStorage.setItem("candidateEmail", profile.email || "");
    sessionStorage.setItem("candidateDomain", sessionStorage.getItem("domain") || "dev");

    window.location.href = "profile-preview.html";
  }

  async function searchProfiles() {
    try {
      await ensureProfileCompletionHelper();
      const query = document.getElementById("searchInput").value.trim();

      if (query.length === 0) {
        document.getElementById("searchResultsTable").hidden = true;
        return;
      } else {
        document.getElementById("searchResultsTable").hidden = false;
      }

      let domain = sessionStorage.getItem("domain");
      if (!domain) domain = "dev";

      const fd = new FormData();
      fd.append("domain", domain);
      fd.append("search_string", query);

      const responseAzure = await fetch("/api/azure/searchNameEmail", {
        method: "POST",
        body: fd,
      });

      const resultsAzure = await responseAzure.json();

      const tbody = document.getElementById("searchResults");
      tbody.innerHTML = "";

      if (resultsAzure.length === 0) {
        tbody.innerHTML =
          '<tr class="search-result-row"><td class="search-result-row">No results found.</td></tr>';
        return;
      }

      const candidateId = sessionStorage.getItem("candidateId");

      resultsAzure.forEach((r, i) => {
        const tr = document.createElement("tr");

        tr.classList.add("search-result-row");

        if (candidateId && r.id + "" === candidateId) {
          tr.classList.add("active-candidate-row");
        }

        tr.id = `searchRow-${r._id}`;
        tr.style.cursor = "pointer";
        tr.innerHTML = `<td class="search-result-formatting"><h3 class="search-result-formatting">${r.firstName || ""} ${r.lastName || ""}</h3><p class="muted search-result-formatting" style="margin: 1px; padding: 1px;">${r.email || ""}</p><div id="topSearchCompletion-${r.id}"></div></td>`;
        tr.addEventListener("click", () => searchSelect(r));
        tbody.appendChild(tr);
        if (window.profileCompletion) {
          window.profileCompletion.renderCompletionActionIfNeeded(
            r,
            `topSearchCompletion-${r.id}`,
            "Complete profile",
          );
        }
      });
    } catch (error) {
      console.error("Error searching profiles:", error);
    }
  }

  document
    .getElementById("searchInput")
    .addEventListener("input", searchProfiles);

  // Hide search results when clicking outside
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".search-container")) {
      document.getElementById("searchResultsTable").hidden = true;
    }
  });

  document
    .getElementById("searchButton")
    .addEventListener("click", searchButton);

  document
    .getElementById("aiRadarRun")
    ?.addEventListener("click", () => runOpportunityRadar(false));

  document
    .getElementById("aiRadarPanel")
    ?.addEventListener("click", (event) => {
      if (event.target && event.target.id === "aiRadarScanExternal") {
        runOpportunityRadar(true);
      }
    });

  document
    .getElementById("aiRadarClose")
    ?.addEventListener("click", () => {
      document.getElementById("aiRadarPanel").classList.remove("active");
      document.getElementById("aiRadarClose").hidden = true;
      document.querySelector(".topbar-tools")?.classList.remove("radar-expanded");
    });

  document.addEventListener("devready-open-opportunity-radar", () => window.openOpportunityRadar());
  applyHeaderShortcutAccess();
  applyHeaderShortcutDomains();
  updateRadarVisibility();
  renderHeaderUserContext();
</script>
